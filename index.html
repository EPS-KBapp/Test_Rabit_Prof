<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test Rabit – Analyse de classe</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#1d2a24;--mut:#5f6d65;--line:#d9dfd9;--acc:#1f5f4a;--pos:#1f7a4a;--neg:#b3412f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a17;--card:#1d2621;--ink:#e8efe9;--mut:#9fb0a5;--line:#33403a;--acc:#6fd0a8;--pos:#6fd0a8;--neg:#f0907f}}
:root[data-theme="dark"]{--bg:#141a17;--card:#1d2621;--ink:#e8efe9;--mut:#9fb0a5;--line:#33403a;--acc:#6fd0a8;--pos:#6fd0a8;--neg:#f0907f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif}
h1,h2,h3{font-family:"Barlow Condensed",Barlow,sans-serif;margin:0;font-weight:700}
h1{font-size:2rem}h2{font-size:1.4rem;margin-bottom:.4rem}h3{font-size:1.1rem;margin:.8rem 0 .3rem}
header{padding:1rem 1.2rem;display:flex;gap:1rem;align-items:baseline;flex-wrap:wrap;border-bottom:4px solid;border-image:linear-gradient(90deg,#8fd58f 33%,#f2b866 33% 66%,#e8645f 66%) 1}
header p{margin:0;color:var(--mut)}
main{display:grid;grid-template-columns:minmax(300px,400px) 1fr;gap:1rem;padding:1rem;max-width:1280px;margin:auto;align-items:start}
@media(max-width:860px){main{grid-template-columns:1fr}}
.col{display:grid;gap:1rem}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem;min-width:0}
fieldset{border:0;padding:0;margin:0 0 .8rem}
legend{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.15rem;padding:0 0 .2rem}
label{display:block;font-size:.85rem;color:var(--mut);margin:.4rem 0 .1rem}
input,select,button,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:.45rem .6rem;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
input:disabled{opacity:.6}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.bar{display:flex;gap:.5rem;flex-wrap:wrap;margin:.5rem 0}
button{cursor:pointer;width:auto;font-weight:600}
button.p{background:var(--acc);color:var(--card);border-color:var(--acc)}
.tabs{display:flex;gap:.4rem;margin:.2rem 0 .6rem}
.tabs button{flex:1}
.tabs button[aria-pressed="true"]{background:var(--acc);color:var(--card);border-color:var(--acc)}
.list{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:.5rem}
.row{display:flex;justify-content:space-between;gap:.5rem;width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;text-align:left;font-weight:400;background:transparent}
.row[aria-current="true"]{background:var(--bg);font-weight:600;box-shadow:inset 3px 0 var(--acc)}
.chip{font-size:.75rem;padding:0 .35rem;border-radius:4px;border:1px solid var(--line);color:var(--mut)}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--card)}
.sw{display:inline-block;width:.8rem;height:.8rem;border-radius:3px;margin-right:.35rem;vertical-align:-1px}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:.3rem .45rem;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600;font-size:.82rem}
.pos{color:var(--pos);font-weight:600}.neg{color:var(--neg);font-weight:600}
svg{max-width:100%;height:auto;display:block;margin:auto}
svg text{fill:var(--ink);font-family:Barlow,sans-serif}
.note{color:var(--mut);font-size:.85rem;margin:.3rem 0}
.pend{border:1px solid var(--line);border-radius:8px;padding:.5rem;margin:.4rem 0}.pend p{margin:0 0 .3rem}.pend button{display:block;width:100%;text-align:left;margin:.25rem 0}
.sh-head{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap;border-bottom:2px solid var(--acc);margin-bottom:.5rem}
.sh-head p{margin:0;color:var(--mut)}
.sh-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:1rem;align-items:start}
@media(max-width:600px){.sh-grid{grid-template-columns:1fr}}
.crit{margin:.4rem 0 0;padding:0;list-style:none;font-size:.85rem}
.legend{display:flex;gap:1rem;justify-content:center;font-size:.8rem;color:var(--mut)}
#sheets{display:none}
@media print{
 @page{size:A4;margin:10mm}
 :root:root:root{--bg:#fff;--card:#fff;--ink:#000;--mut:#444;--line:#bbb;--acc:#1f5f4a;--pos:#1f7a4a;--neg:#b3412f}
 header,main{display:none!important}
 #sheets{display:block}
 body{background:#fff;font-size:13px}
 .sheet{break-after:page;page-break-after:always}
 .sheet:last-child{break-after:auto;page-break-after:auto}
 h3{margin:.5rem 0 .2rem}
}
</style>
</head>
<body>
<header><h1>Test Rabit</h1><p>Importe une classe, saisis les deux tests, compare et imprime une fiche par élève.</p></header>
<main>
<div class="col">
 <section aria-label="Classe">
  <h2>Classe</h2>
  <label for="flt">Classe affichée</label><select id="flt"></select>
  <div class="bar"><button class="p" id="new">Nouvel élève</button><button id="delc">Supprimer la classe</button></div>
  <label for="impC">Importer un CSV d’élèves (nom de la classe si le CSV n’en contient pas)</label>
  <div class="g2"><input id="impC" placeholder="ex. 4e B"><input id="csv" type="file" accept=".csv,text/csv" aria-label="Fichier CSV"></div>
  <label for="resF">Importer les résultats saisis par les élèves (fichiers .txt reçus)</label>
  <input id="resF" type="file" accept=".txt,text/plain" multiple aria-label="Fichiers de résultats des élèves">
  <p class="note" id="msg" aria-live="polite"></p>
  <div id="pend"></div>
  <div id="list" class="list"></div>
 </section>
 <section id="form" aria-label="Saisie" hidden>
  <fieldset><legend>Élève</legend>
   <div class="g2"><div><label for="nom">Nom</label><input id="nom"></div><div><label for="prenom">Prénom</label><input id="prenom"></div></div>
   <div class="g2"><div><label for="classe">Classe</label><input id="classe"></div><div><label for="sexe">Sexe</label><select id="sexe"><option value="F">Fille</option><option value="G">Garçon</option></select></div></div>
   <div class="g2"><div><label for="naiss">Né(e) le</label><input id="naiss" type="date"></div><div><label for="age">Âge (ans)</label><input id="age" type="number" inputmode="decimal" min="10" max="30"></div></div>
   <label for="mobile">Mobile d’agir choisi par l’élève</label><select id="mobile"><option value="">Non choisi</option><option value="perception">Perception</option><option value="acidose">Acidose</option><option value="cardio">Cardio</option></select>
  </fieldset>
  <div class="tabs" role="group" aria-label="Test à saisir"><button id="tb0" aria-pressed="true">Test 1</button><button id="tb1" aria-pressed="false">Test 2</button></div>
  <fieldset>
   <label for="date">Date du test</label><input id="date" type="date">
   <div class="g2"><div><label for="dSp10">Sprint 10″ (m)</label><input id="dSp10" type="number" inputmode="decimal" min="0"></div>
   <div><label for="dSp30">Sprint 30″ (m)</label><input id="dSp30" type="number" inputmode="decimal" min="0"></div></div>
   <label for="fc">FC après les 3 min « dure » (bpm)</label><input id="fc" type="number" inputmode="numeric" min="0">
  </fieldset>
  <fieldset><legend>Perception (m parcourus)</legend>
   <label for="dF1"><i class="sw" style="background:#8fd58f"></i>« Facile » début – 10 min</label><input id="dF1" type="number" inputmode="decimal" min="0">
   <label for="dM"><i class="sw" style="background:#f2b866"></i>« Moyenne » – 5 min</label><input id="dM" type="number" inputmode="decimal" min="0">
   <label for="dD"><i class="sw" style="background:#e8645f"></i>« Dure » – 3 min</label><input id="dD" type="number" inputmode="decimal" min="0">
   <label for="dF2"><i class="sw" style="background:#8fd58f"></i>« Facile » fin – 5 min</label><input id="dF2" type="number" inputmode="decimal" min="0">
  </fieldset>
  <div class="bar"><button id="deln">Supprimer l’élève</button></div>
  <p class="note">Tout est enregistré automatiquement dans ce navigateur.</p>
 </section>
</div>
<section aria-live="polite">
 <div class="bar"><button class="p" id="p1">Imprimer cette fiche</button><button id="pc">Imprimer toute la classe (1 feuille par élève)</button><button id="xl">Exporter les évaluations (Excel)</button></div>
 <div id="out"><p class="note">Importe un CSV ou crée un élève, puis saisis la distance « dure » pour voir le bilan.</p></div>
</section>
</main>
<div id="sheets"></div>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>

<script>
const $=id=>document.getElementById(id);
const r1=x=>(Math.round(x*10)/10).toString().replace(".",",");
const r0=x=>String(Math.round(x));
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fd=d=>d?d.split("-").reverse().join("/"):"";
const N=v=>{const x=parseFloat(v);return isNaN(x)?null:x};
const pts=(v,t)=>v<t[0]?1:v<=t[1]?2:v<=t[2]?3:v<=t[3]?4:5;
const kmh=(d,m)=>d/m*0.06;
const COL={fac:"#8fd58f",moy:"#f2b866",dur:"#e8645f"};
const TF=["date","dSp10","dSp30","fc","dF1","dM","dD","dF2"],PF=["nom","prenom","classe","sexe","naiss","age","mobile"];
const blankT=()=>TF.reduce((a,f)=>(a[f]="",a),{});
const mk=(o={})=>({id:"s"+Date.now()+Math.random().toString(36).slice(2,6),nom:"",prenom:"",classe:"",sexe:"F",naiss:"",mobile:"",age:15,t:[blankT(),blankT()],...o});

/* ---------- stockage ---------- */
let DB=null,cur=null,curT=0;
function loadDB(){
  let d=null;try{d=JSON.parse(localStorage.getItem("rabit2"))}catch(e){}
  if(!d){d={s:{}};try{const o=JSON.parse(localStorage.getItem("rabit")||"{}");
    for(const k in o){const r=o[k],t0=blankT();TF.forEach(f=>t0[f]=r[f]||"");const s=mk({id:"m"+k,nom:r.nom||"",prenom:r.prenom||"",classe:r.classe||"",sexe:r.sexe||"F",age:r.age||15});s.t[0]=t0;d.s[s.id]=s}}catch(e){}}
  DB=d;
}
const save=()=>{try{localStorage.setItem("rabit2",JSON.stringify(DB))}catch(e){}};
const all=()=>Object.values(DB.s).sort((a,b)=>(a.nom+a.prenom).localeCompare(b.nom+b.prenom,"fr"));

/* ---------- calculs ---------- */
function ageAt(s,date){
  if(!s.naiss)return +s.age||15;
  const b=new Date(s.naiss),d=date?new Date(date):new Date();let a=d.getFullYear()-b.getFullYear();
  if(d.getMonth()<b.getMonth()||(d.getMonth()==b.getMonth()&&d.getDate()<b.getDate()))a--;return a;
}
function compute(s,t){
  const o={},d10=N(t.dSp10),d30=N(t.dSp30),fc=N(t.fc),dF1=N(t.dF1),dF2=N(t.dF2),dM=N(t.dM),dD=N(t.dD);
  o.fcmax=210-0.65*ageAt(s,t.date);
  if(d10!=null){o.v10=d10*0.36;o.pPuis=pts(o.v10,s.sexe=="F"?[19,21,23,25]:[22,24,26,28])}
  if(fc){o.pctFc=fc/o.fcmax*100;const p=o.pctFc;o.pCard=p<55?1:p<65?2:p<75?3:p<90?4:5}
  if(d30!=null){o.d30=d30;o.pAc=pts(d30,[120,130,140,150])}
  if(dD){o.vD=kmh(dD,3);o.vma=dD*2/100}
  if(dM)o.vM=kmh(dM,5);
  const fs=[];if(dF1)fs.push(kmh(dF1,10));if(dF2)fs.push(kmh(dF2,5));
  if(fs.length)o.vF=fs.reduce((a,b)=>a+b)/fs.length;
  o.zone={};
  for(const [k,v] of [["fac",o.vF],["moy",o.vM],["dur",o.vD]])if(v)o.zone[k]=[v*0.875,v,v*1.125];
  if(o.vD&&o.vM&&o.vF){
    o.rm=Math.round(o.vM/o.vD*1e6)/1e6;o.rf=Math.round(o.vF/o.vD*1e6)/1e6;
    o.c=[o.rm>=.75&&o.rm<=.85,o.rf>=.5&&o.rf<=.6,o.zone.moy[0]>o.zone.fac[2],o.zone.dur[0]>o.zone.moy[2]];
    o.pPerc=1+o.c.filter(Boolean).length;
  }
  return o;
}

  for(let l=1;l<=5;l++){g+=`<polygon points="${[0,1,2,3].map(i=>pt(i,l).join(",")).join(" ")}" fill="none" stroke="currentColor" opacity=".18"/><text x="${cx+4}" y="${cy-R*l/5+11}" font-size="10" opacity=".6">${l}</text>`}
  ax.forEach((a,i)=>{const e=pt(i,5);g+=`<line x1="${cx}" y1="${cy}" x2="${e[0]}" y2="${e[1]}" stroke="currentColor" opacity=".25"/>`});

  });

  ax.forEach((a,i)=>{const[x,y,an]=lab[i];g+=`<text x="${x}" y="${y}" text-anchor="${an}" font-size="14" font-weight="600">${a[0]}</text><text x="${x}" y="${y+16}" text-anchor="${an}" font-size="13" opacity=".8">${items.map(it=>it.o[a[1]]??"–").join(" → ")} / ${a[2]}</text>`});
  return `<svg viewBox="0 0 460 300" role="img" aria-label="Graphique toile d’araignée">${g}</svg>`+(cmp?`<div class="legend"><span>- - Test 1</span><span style="color:var(--acc);font-weight:600">— Test 2</span></div>`:"");

function zones(o){

function parseCSV(txt){
  txt=txt.replace(/^\uFEFF/,"");const first=txt.split(/\r?\n/)[0],dl=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?";":",";
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){if(c=='"'){if(txt[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true;else if(c==dl){row.push(f);f=""}else if(c=="\n"){row.push(f);rows.push(row);row=[];f=""}else if(c!="\r")f+=c}
  if(f||row.length){row.push(f);rows.push(row)}return rows;
}
const nz=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
function splitName(full){
  const t=full.trim().split(/\s+/),up=w=>/\p{L}/u.test(w)&&w===w.toUpperCase();let i=0;
  while(i<t.length-1&&up(t[i]))i++;
  return i==0?{nom:t[0]||"",prenom:t.slice(1).join(" ")}:{nom:t.slice(0,i).join(" "),prenom:t.slice(i).join(" ")};
}
$("csv").onchange=async e=>{

  const buf=await f.arrayBuffer();let txt;
  try{txt=new TextDecoder("utf-8",{fatal:true}).decode(buf)}catch(x){txt=new TextDecoder("windows-1252").decode(buf)}
  const rows=parseCSV(txt),h=rows[0].map(nz);
  const iN=h.findIndex(x=>x.startsWith("eleve")||x=="nom"),iP=h.indexOf("prenom"),iB=h.findIndex(x=>x.startsWith("ne(e)")||x.includes("naissance")),iS=h.indexOf("sexe"),iC=h.findIndex(x=>x.startsWith("classe"));
  if(iN<0){$("msg").textContent="Colonne « Élèves » introuvable dans ce fichier.";e.target.value="";return}
  let n=0,skip=0,classe="";const dflt=$("impC").value.trim();
  rows.slice(1).forEach(r=>{
    const raw=(r[iN]||"").trim();if(!raw)return;
    const nm=iP>=0?{nom:raw,prenom:(r[iP]||"").trim()}:splitName(raw);
    const m=/(\d{2})\/(\d{2})\/(\d{4})/.exec(iB>=0?r[iB]||"":""),naiss=m?`${m[3]}-${m[2]}-${m[1]}`:"";
    const cl=(iC>=0&&(r[iC]||"").trim())||dflt;classe=cl;
    if(all().some(s=>nz(s.nom)==nz(nm.nom)&&nz(s.prenom)==nz(nm.prenom)&&s.naiss==naiss&&(s.classe||"")==cl)){skip++;return}
    const s=mk({...nm,classe:cl,sexe:iS>=0&&/^f/i.test((r[iS]||"").trim())?"F":"G",naiss});DB.s[s.id]=s;n++;
  });
  save();flt=classe||"*";renderFilter();renderList();
  $("msg").textContent=`${n} élève${n>1?"s":""} importé${n>1?"s":""}${skip?`, ${skip} déjà présent${skip>1?"s":""}`:""}${classe?" dans « "+classe+" »":""}.`;
  e.target.value="";
};

/* ---------- résultats des élèves ---------- */
const RES=["dSp10","dSp30","fc","dF1","dM","dD","dF2"];
const nk=s=>nz(s||"").replace(/\s+/g," ");
const compact=s=>nk(s).replace(/[^a-z0-9]/g,"");
function lev(a,b){const d=[];for(let i=0;i<=a.length;i++)d[i]=[i];for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]==b[j-1]?0:1));
  return d[a.length][b.length]}
const sim=(a,b)=>a==b?1:1-lev(a,b)/Math.max(a.length,b.length,1);
const nameSim=(s,o)=>{const a=compact(s.nom+s.prenom);return Math.max(sim(a,compact((o.nom||"")+(o.prenom||""))),sim(a,compact((o.prenom||"")+(o.nom||""))))};
const PEND=[];
function decodeAll(txt){
  const out=[],re=new RegExp("RABIT1:[A-Za-z0-9+/=]+","g");let m;
  while((m=re.exec(txt))){try{out.push(JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(m[0].slice(7)),c=>c.charCodeAt(0)))))}catch(e){}}
  if(!out.length){try{const j=JSON.parse(txt);out.push(...(Array.isArray(j)?j:[j]))}catch(e){}}
  return out.filter(o=>o&&o.app=="rabit"&&Array.isArray(o.t));
}
/* Cherche l’élève : {s} trouvé, {s,fuzzy} rapproché, {pending:[…]} à confirmer, ou null */
function findMatch(o){
  const L=all().map(s=>({s,sim:nameSim(s,o)}));
  const same=(a,b)=>!!a&&!!b&&a==b,diff=(a,b)=>!!a&&!!b&&a!=b;
  let ex=L.filter(x=>x.sim==1).map(x=>x.s);
  if(ex.length){
    if(ex.length>1&&o.naiss){const d=ex.filter(s=>s.naiss==o.naiss);if(d.length)ex=d}
    if(ex.length>1&&o.classe){const d=ex.filter(s=>nk(s.classe)==nk(o.classe));if(d.length)ex=d}
    return{s:ex[0]};
  }
  const auto=[],ask=[];
  L.filter(x=>x.sim>=.75).forEach(x=>{
    const s=x.s,sc=same(s.naiss,o.naiss),sameCl=!!nk(s.classe)&&nk(s.classe)==nk(o.classe);
    x.rank=x.sim+(sc?.2:0)+(sameCl?.05:0);
    if(x.sim>=.9&&(sc||((!s.naiss||!o.naiss)&&sameCl)))auto.push(x);
    else if(!(diff(s.naiss,o.naiss)&&x.sim<.9))ask.push(x);
  });
  if(auto.length==1)return{s:auto[0].s,fuzzy:true};
  const c=auto.concat(ask).sort((a,b)=>b.rank-a.rank).slice(0,3);
  return c.length?{pending:c}:null;
}
const newFrom=o=>{const s=mk({nom:o.nom,prenom:o.prenom||"",classe:o.classe||"",sexe:o.sexe=="G"?"G":"F",naiss:o.naiss||"",mobile:MOBS[o.mobile]?o.mobile:"",age:o.age||15});DB.s[s.id]=s;return s};
function applyRes(s,o,slots){
  if(!s.naiss&&o.naiss)s.naiss=o.naiss;
  if(o.mobile&&MOBS[o.mobile])s.mobile=o.mobile;
  slots.forEach(i=>TF.forEach(f=>s.t[i][f]=o.t[i][f]??""));
}
function mergeRes(o){
  const slots=[0,1].filter(i=>o.t[i]&&RES.some(f=>o.t[i][f]!==""&&o.t[i][f]!=null));
  if(!slots.length||!nk(o.nom))return null;
  const m=findMatch(o);
  if(m&&m.pending)return{pending:m.pending,slots};
  let s=m&&m.s,created=false;
  if(!s){s=newFrom(o);created=true}
  applyRes(s,o,slots);
  return{s,created,slots,fuzzy:m&&m.fuzzy};
}
function renderPend(){
  const nm=s=>(s.prenom+" "+s.nom).trim();
  $("pend").innerHTML=PEND.length?`<p class="note"><b>À vérifier</b> : ces élèves ressemblent à des fiches existantes. Choisis la bonne fiche.</p>`+PEND.map((p,i)=>`<div class="pend"><p><b>${esc(nm(p.o))}</b> (${esc(p.o.classe||"classe ?")}${p.o.naiss?", né(e) le "+fd(p.o.naiss):""}) ressemble à :</p>${p.c.map(x=>`<button data-i="${i}" data-a="${x.s.id}">${esc(nm(x.s))} – ${esc(x.s.classe||"sans classe")}${x.s.naiss?" – "+fd(x.s.naiss):""}</button>`).join("")}<button data-i="${i}" data-a="new">Aucune : nouvel élève</button></div>`).join(""):"";
}
function refresh(){save();renderFilter();renderList();renderPend();if(cur){fillForm();renderOut()}}
function importRes(texts){
  const list=texts.flatMap(decodeAll);
  if(!list.length){$("msg").textContent="Aucun résultat reconnu : vérifie le fichier reçu.";return}
  let ok=0,empty=0,ask=0;const cre=[],fz=[];
  list.forEach(o=>{
    const r=mergeRes(o);
    if(!r){empty++;return}
    if(r.pending){PEND.push({o,slots:r.slots,c:r.pending});ask++;return}
    const nm=(r.s.prenom+" "+r.s.nom).trim();
    if(r.created)cre.push(nm);else{ok++;if(r.fuzzy)fz.push(`${(o.prenom+" "+o.nom).trim()} → ${nm}`)}
  });
  refresh();
  const p=[`${ok} élève${ok>1?"s":""} mis à jour`];
  if(fz.length)p.push(`dont ${fz.length} rapproché${fz.length>1?"s":""} malgré une différence d’écriture (${fz.join(", ")})`);
  if(ask)p.push(`${ask} à vérifier ci-dessous`);
  if(cre.length)p.push(`${cre.length} non trouvé${cre.length>1?"s":""} et ajouté${cre.length>1?"s":""} : ${cre.join(", ")}`);
  if(empty)p.push(`${empty} sans résultat, ignoré${empty>1?"s":""}`);
  $("msg").textContent=p.join(" ; ")+".";
}
$("pend").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;const i=+b.dataset.i,p=PEND[i];if(!p)return;
  const s=b.dataset.a=="new"?newFrom(p.o):DB.s[b.dataset.a];if(!s)return;
  applyRes(s,p.o,p.slots);PEND.splice(i,1);refresh();
  $("msg").textContent="Résultats de "+(s.prenom+" "+s.nom).trim()+" enregistrés.";
};

function lastO(s){for(let i=1;i>=0;i--){const o=compute(s,s.t[i]);if(o.vD)return o}return null}
async function buildEval(X,b64,list){
  const wb=new X.Workbook();
  await wb.xlsx.load(Uint8Array.from(atob(b64),c=>c.charCodeAt(0)).buffer);
  const T={};
  wb.worksheets.forEach(w=>Object.keys(MOBS).forEach(k=>{if(nz(w.name).includes(k))T[k]=w}));
  const used=new Set();
  list.forEach(({s,o})=>{
    const tp=T[s.mobile];
    let base=((s.nom+" "+s.prenom).trim()||"Élève").replace(/[\[\]:*?\/\\]/g," ").replace(/\s+/g," ").slice(0,31),nm=base,n=2;
    while(used.has(nm.toLowerCase())){nm=base.slice(0,28)+" "+n++}
    used.add(nm.toLowerCase());
    const ws=wb.addWorksheet("tmp");
    ws.model=Object.assign({},tp.model,{mergeCells:tp.model.merges,name:nm});
    ws.getCell("A1").value="Nom : "+s.nom;
    ws.getCell("D1").value="Prénom : "+s.prenom;
    ws.getCell("G1").value="Classe : "+(s.classe||"");
    for(let c=3;c<=12;c++){
      const a=nz(String(ws.getCell(6,c).value||"")),k=a.includes("dure")?"dur":a.includes("moyen")||a.includes("sprint")?"moy":a.includes("facile")?"fac":null;
      const z=k&&o.zone[k];if(!z)continue;
      [[7,`${r1(z[0])} – ${r1(z[2])}`],[8,`${r0(z[0]*50)} – ${r0(z[2]*50)}`]].forEach(([r,v])=>{
        const cell=ws.getCell(r,c);cell.value=v;cell.alignment={...cell.alignment,horizontal:"center",vertical:"middle",wrapText:true}});
    }
  });
  Object.values(T).forEach(w=>wb.removeWorksheet(w.id));
  return wb.xlsx.writeBuffer();
}

$("xl").onclick=async()=>{
  const m=x=>$("msg").textContent=x;
  if(!window.ExcelJS){m("La bibliothèque Excel ne s’est pas chargée : vérifie ta connexion internet puis réessaie.");return}
  const ok=[],noM=[],noT=[],nm=s=>(s.prenom+" "+s.nom).trim()||"(sans nom)";
  all().filter(inF).forEach(s=>{if(!MOBS[s.mobile]){noM.push(nm(s));return}const o=lastO(s);if(!o){noT.push(nm(s));return}ok.push({s,o})});
  if(!ok.length){m("Rien à exporter : il faut, pour chaque élève, un mobile d’agir choisi et au moins un test saisi (distance « dure »).");return}
  try{
    const buf=await buildEval(ExcelJS,TPL,ok);
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
    a.download="Evaluations_"+(flt=="*"?"toutes_classes":flt=="@"?"sans_classe":nz(flt).replace(/[^a-z0-9]+/g,"_"))+".xlsx";
    document.body.appendChild(a);a.click();a.remove();
    m(`${ok.length} feuille${ok.length>1?"s":""} exportée${ok.length>1?"s":""} (fourchettes du dernier test saisi).`+(noM.length?` Mobile non choisi, non exporté${noM.length>1?"s":""} : ${noM.join(", ")}.`:"")+(noT.length?` Sans test saisi : ${noT.join(", ")}.`:""));
  }catch(e){m("L’export a échoué : "+e.message)}
};

/* ---------- impression ---------- */
function doPrint(list){
  const h=list.map(sheetHTML).filter(Boolean);
  if(!h.length){$("msg").textContent="Rien à imprimer : saisis d’abord la distance « dure » d’au moins un test.";return}
  $("sheets").innerHTML=h.join("");setTimeout(()=>window.print(),60);
}
$("p1").onclick=()=>cur?doPrint([cur]):($("msg").textContent="Choisis d’abord un élève.");
$("pc").onclick=()=>doPrint(all().filter(inF));

loadDB();renderFilter();renderList();fillForm();
